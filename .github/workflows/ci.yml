name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm --disable-download-timeout python ffmpeg git

      - uses: astral-sh/setup-uv@v5

      - name: Sync locked environment
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check scoria tests

      - name: Format
        run: uv run ruff format --check scoria tests

      - name: Test
        run: uv run pytest