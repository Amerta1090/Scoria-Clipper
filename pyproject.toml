[project]
name = "scoria"
version = "0.1.0"
description = "Deterministic, local-first video clipping engine (console entry point: clipper)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.scripts]
clipper = "scoria.cli.main:main"

[project.urls]
Homepage = "https://github.com/Amerta1090/Scoria-Clipper"
Repository = "https://github.com/Amerta1090/Scoria-Clipper"
Issues = "https://github.com/Amerta1090/Scoria-Clipper/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scoria"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"